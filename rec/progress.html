<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi des participants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: summary line, then one row per participant session, newest first. */
:root {
  --bg: #f6f4ef; --surface: #ffffff; --ink: #1d1f24; --muted: #6a6d74; --rule: #dedad1;
  --ok: #2f7d4f; --live: #d6342c;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #15161a; --surface: #1f2126; --ink: #f1efe9; --muted: #a3a6ad; --rule: #34363d; --ok: #5cc184; --live: #ff5a4f; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #15161a; --surface: #1f2126; --ink: #f1efe9; --muted: #a3a6ad; --rule: #34363d; --ok: #5cc184; --live: #ff5a4f; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); padding: 24px 16px; line-height: 1.5; }
main { max-width: 44rem; margin: 0 auto; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 900; }
.summary { display: flex; flex-wrap: wrap; gap: 8px 20px; font-variant-numeric: tabular-nums; }
.summary b { font-size: 1.4rem; display: block; }
.muted { color: var(--muted); font-size: .9rem; }
.rows { display: grid; gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.name { font-weight: 700; }
.tags { color: var(--muted); font-size: .9rem; }
.bar { height: 8px; background: var(--rule); border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; background: var(--ink); }
.row.complete .bar > div { background: var(--ok); }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.live { color: var(--live); font-weight: 700; }
.error { color: var(--live); }
</style>
</head>
<body>
<main>
  <h1>Suivi des participants</h1>
  <div class="summary" id="summary"><span class="muted">Chargement…</span></div>
  <div class="rows" id="rows"></div>
  <p class="muted" id="updated"></p>
</main>
<script>
"use strict";
const SUPABASE_URL = "https://hwzescarembanrjzgjej.supabase.co";
const SUPABASE_KEY = "sb_publishable_4LkCBSdg9tQHrgZ2L4r5wQ_bXMALrys";
// Words per session (target + near misses), as on the recording page.
const TOTAL = { ko: 61, fr: 40 };
const LANG = { ko: "한국어", fr: "Français" };
const COND = { calme: "calme", bruit: "bruyant" };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function ago(iso) {
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 90) return "à l'instant";
  if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
}

async function refresh() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/near_miss_progress`, {
      method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: "{}",
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const rows = (await r.json()).filter((x) => !x.speaker.startsWith("_"));
    const people = new Set(rows.map((x) => x.speaker)).size;
    const complete = rows.filter((x) => x.words >= (TOTAL[x.lang_code] || 0)).length;
    const takes = rows.reduce((n, x) => n + x.takes, 0);
    const live = rows.filter((x) => Date.now() - new Date(x.last_take_at) < 120000).length;
    document.getElementById("summary").innerHTML = `
      <span><b>${people}</b><span class="muted">participant${people > 1 ? "s" : ""}</span></span>
      <span><b>${complete}</b><span class="muted">séance${complete > 1 ? "s" : ""} complète${complete > 1 ? "s" : ""}</span></span>
      <span><b>${takes}</b><span class="muted">prises</span></span>
      <span><b class="${live ? "live" : ""}">${live}</b><span class="muted">en cours</span></span>`;
    document.getElementById("rows").innerHTML = rows.length ? rows.map((x) => {
      const total = TOTAL[x.lang_code] || x.words;
      const pct = Math.min(100, Math.round((x.words / total) * 100));
      const isLive = Date.now() - new Date(x.last_take_at) < 120000;
      return `<div class="row ${x.words >= total ? "complete" : ""}">
        <div class="head"><span class="name">${esc(x.speaker)}</span>
          <span class="tags">${LANG[x.lang_code] || esc(x.lang_code)} · ${COND[x.condition] || esc(x.condition)}</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="meta"><span>${x.words} / ${total} mots${x.takes > x.words ? ` · ${x.takes - x.words} refait${x.takes - x.words > 1 ? "s" : ""}` : ""}</span>
          <span class="${isLive ? "live" : ""}">${isLive ? "● en cours" : ago(x.last_take_at)}</span></div>
      </div>`;
    }).join("") : `<p class="muted">Personne n'a encore enregistré.</p>`;
    document.getElementById("updated").textContent = `Mis à jour ${new Date().toLocaleTimeString("fr-FR")} · actualisation toutes les 15 s`;
  } catch (err) {
    document.getElementById("updated").innerHTML = `<span class="error">Impossible de charger le suivi (${esc(err.message)}). Nouvel essai dans 15 s.</span>`;
  }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
