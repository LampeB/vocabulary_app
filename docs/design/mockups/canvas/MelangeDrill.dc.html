<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="height: 5px; border-radius: 3px; background: #ECE3D7; overflow: hidden;">
    <div style="height: 100%; width: 30%; background: #D08358;"></div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; height: 40px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    <b style="flex: 1; font-size: 15px; font-weight: 700;">Mélange · 6/20</b>
    <span style="font-size: 11px; font-weight: 800; color: #8A8073;">noté</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Complète la phrase</span>
    <b style="font-size: 21px; line-height: 1.4; font-weight: 700;">___ amiga no trabaj___ el domingo.</b>
    <span style="font-size: 14px; color: #756C62;">Mon amie ne travaille pas le dimanche.</span>
  </div>

  <div style="min-height: 62px; border-bottom: 2px solid #DDD2C2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 10px;">
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;"><span style="color: #8A8073; font-size: 11px; margin-right: 4px;">1</span>Mi</span>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 9px;">
    <span style="background: #EFE7DB; border: 1.5px dashed #DDD2C2; border-radius: 12px; padding: 11px 15px; font-size: 15.5px; font-weight: 700; color: #B0A695;">Mi</span>
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 11px 15px; font-size: 15.5px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">a</span>
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 11px 15px; font-size: 15.5px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">-o</span>
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 11px 15px; font-size: 15.5px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">-a</span>
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 11px 15px; font-size: 15.5px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">-as</span>
  </div>

  <div style="display: flex; gap: 11px; background: #EFE7DB; border-radius: 14px; padding: 14px 16px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F695F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #6F695F;">Trois règles dans une seule phrase : possessif, négation, conjugaison. Pas de feedback avant la fin — c'est l'examen du cluster.</p>
  </div>

  <div style="margin-top: auto; min-height: 52px; border-radius: 16px; background: #A85A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Vérifier</div>

</div>
</x-dc>

</html>
