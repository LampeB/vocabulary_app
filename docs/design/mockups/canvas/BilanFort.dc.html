<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E0A079; text-decoration: none; }
    a:hover { color: #F6DFCE; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #241F1B; box-sizing: border-box; padding: 40px 24px 32px; display: flex; flex-direction: column; gap: 22px; font-family: Figtree, system-ui, sans-serif; color: #F6F1EA;">

  <div style="display: flex; align-items: center;">
    <span style="flex: 1; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #9A9086;">Semaine du 15 au 21 août</span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <b style="font-size: 62px; line-height: 0.95; font-weight: 800; color: #E0A079; font-variant-numeric: tabular-nums;">41</b>
      <span style="font-size: 17px; font-weight: 700; color: #CFC6BA;">mots appris</span>
    </div>
    <h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance;">Grosse semaine. Ton meilleur score depuis le début.</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; background: #2E2823; border-radius: 18px; padding: 18px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #9A9086;">6 jours actifs sur 7</span>
    <div style="display: flex; gap: 7px;">
      <div style="flex: 1; height: 44px; border-radius: 10px; background: #C4703F;"></div>
      <div style="flex: 1; height: 44px; border-radius: 10px; background: #C4703F;"></div>
      <div style="flex: 1; height: 44px; border-radius: 10px; background: #C4703F;"></div>
      <div style="flex: 1; height: 44px; border-radius: 10px; background: #3A332C;"></div>
      <div style="flex: 1; height: 44px; border-radius: 10px; background: #C4703F;"></div>
      <div style="flex: 1; height: 44px; border-radius: 10px; background: #C4703F;"></div>
      <div style="flex: 1; height: 44px; border-radius: 10px; background: #C4703F;"></div>
    </div>
    <div style="display: flex; gap: 7px;">
      <span style="flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: #9A9086;">L</span>
      <span style="flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: #9A9086;">M</span>
      <span style="flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: #9A9086;">M</span>
      <span style="flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: #9A9086;">J</span>
      <span style="flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: #9A9086;">V</span>
      <span style="flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: #9A9086;">S</span>
      <span style="flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: #9A9086;">D</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="background: #2E2823; border-radius: 16px; padding: 15px 16px; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #9A9086;">Révisions</span>
      <b style="font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums;">210</b>
    </div>
    <div style="background: #2E2823; border-radius: 16px; padding: 15px 16px; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #9A9086;">Précision</span>
      <b style="font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums;">89 %</b>
    </div>
    <div style="background: #2E2823; border-radius: 16px; padding: 15px 16px; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #9A9086;">Leçons</span>
      <b style="font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums;">4</b>
    </div>
    <div style="background: #2E2823; border-radius: 16px; padding: 15px 16px; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #9A9086;">Série</span>
      <b style="font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums; color: #E0A079;">12</b>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 11px; background: #2E3D35; border-radius: 14px; padding: 14px 16px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CC7B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
    <p style="margin: 0; font-size: 13.5px; line-height: 1.4; color: #9CC7B4; font-weight: 600;">Cluster « Au quotidien » validé cette semaine.</p>
  </div>

  <div style="margin-top: auto; height: 54px; border-radius: 16px; background: #A85A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Continuer</div>

</div>
</x-dc>
</body>
</html>
