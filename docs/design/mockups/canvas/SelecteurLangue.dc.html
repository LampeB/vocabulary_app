<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #8A8177; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 18px 20px 26px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 30px rgba(43,38,34,.25);">

    <div style="width: 38px; height: 4px; border-radius: 2px; background: #E3D9CB; align-self: center;"></div>

    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Tes langues</span>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 2px; border-bottom: 1px solid #F3ECE1;">
        <span style="font-size: 24px; line-height: 1; flex-shrink: 0;">🇪🇸</span>
        <span style="flex: 1; min-width: 0;">
          <b style="font-size: 14.5px;">Espagnol <span style="font-weight: 600; color: #756C62;">· FR ↔ ES</span></b>
          <span style="display: block; font-size: 11.5px; color: #756C62; margin-top: 2px;">🔥 12 · Niveau 1</span>
        </span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3E736D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 2px;">
        <span style="font-size: 24px; line-height: 1; flex-shrink: 0;">🇰🇷</span>
        <span style="flex: 1; min-width: 0;">
          <b style="font-size: 14.5px;">Coréen <span style="font-weight: 600; color: #756C62;">· FR ↔ KO</span></b>
          <span style="display: block; font-size: 11.5px; color: #756C62; margin-top: 2px;">🔥 0 · Niveau 0 · à commencer</span>
        </span>
      </div>
    </div>

    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F; margin-top: 4px;">Découvrir une langue</span>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 2px; border-bottom: 1px solid #F3ECE1;">
        <span style="font-size: 24px; line-height: 1; flex-shrink: 0;">🇬🇧</span>
        <span style="flex: 1; font-size: 14.5px; font-weight: 700;">Anglais</span>
        <span style="color: #C4703F; font-weight: 800; font-size: 19px; flex-shrink: 0;">＋</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 2px; border-bottom: 1px solid #F3ECE1;">
        <span style="font-size: 24px; line-height: 1; flex-shrink: 0;">🇮🇹</span>
        <span style="flex: 1; font-size: 14.5px; font-weight: 700;">Italien</span>
        <span style="color: #C4703F; font-weight: 800; font-size: 19px; flex-shrink: 0;">＋</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 12px 2px;">
        <span style="font-size: 24px; line-height: 1; flex-shrink: 0;">🇩🇪</span>
        <span style="flex: 1; font-size: 14.5px; font-weight: 700;">Allemand</span>
        <span style="color: #C4703F; font-weight: 800; font-size: 19px; flex-shrink: 0;">＋</span>
      </div>
    </div>

    <div style="display: flex; gap: 11px; background: #EFE7DB; border-radius: 14px; padding: 13px 15px; margin-top: 4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F695F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4.5"/><circle cx="12" cy="8.2" r="0.9" fill="#6F695F"/></svg>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #6F695F;">Chaque langue a son chemin, sa série et sa langue de base — tu choisiras depuis laquelle apprendre.</p>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
