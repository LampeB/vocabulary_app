<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 60px 24px 32px; display: flex; flex-direction: column; gap: 24px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 7px; background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 700;">
      <span>🇫🇷</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7h12M8 7l3-3M8 7l3 3"/><path d="M16 17H4M16 17l-3-3M16 17l-3 3"/></svg>
      <span>🇪🇸</span>
      <span style="color: #756C62; font-weight: 600;">· Niveau 1</span>
    </div>
    <h1 style="margin: 0; font-size: 29px; line-height: 1.14; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance;">Ton parcours est prêt.</h1>
    <p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #756C62;">Sept mots par jour, ajustés chaque semaine. Voici par où tu commences.</p>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Premier cluster</span>

    <div style="display: flex; align-items: center; gap: 13px;">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #F6DFCE; border: 2px solid #D08358; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C4703F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v15.5"/><path d="M6 17h13"/><path d="M6 21h13"/><path d="M4 19.5A1.5 1.5 0 0 1 5.5 18"/></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <b style="font-size: 15.5px; font-weight: 800;">Les premiers pas</b>
        <span style="font-size: 12.5px; color: #756C62;">2 listes de mots · 3 leçons · 1 mélange</span>
      </div>
    </div>

    <div style="height: 1px; background: #ECE3D7;"></div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Ton chemin d'aujourd'hui</span>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <div style="width: 38px; height: 38px; border-radius: 12px; background: #F6DFCE; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4703F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </div>
          <span style="font-size: 10.5px; font-weight: 700; color: #756C62; text-align: center;">Découvrir</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <div style="width: 38px; height: 38px; border-radius: 12px; background: #EFE7DB; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v15.5"/><path d="M6 17h13"/></svg>
          </div>
          <span style="font-size: 10.5px; font-weight: 700; color: #8A8073; text-align: center;">Leçon</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <div style="width: 38px; height: 38px; border-radius: 12px; background: #EFE7DB; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <span style="font-size: 10.5px; font-weight: 700; color: #8A8073; text-align: center;">Drill</span>
        </div>
      </div>
      <span style="font-size: 12px; color: #8A8073;">≈ 8 min aujourd'hui</span>
    </div>
  </div>

  <div style="margin-top: auto; height: 54px; border-radius: 16px; background: #A85A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Commencer ma première leçon</div>

</div>
</x-dc>
</body>
</html>
