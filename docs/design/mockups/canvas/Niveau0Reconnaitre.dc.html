<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    .ko { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="height: 5px; border-radius: 3px; background: #ECE3D7; overflow: hidden;">
    <div style="height: 100%; width: 45%; background: #4C8C86;"></div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; height: 40px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    <b style="flex: 1; font-size: 15px; font-weight: 700;">Reconnaître · 5/11</b>
    <span style="font-size: 11.5px; font-weight: 700; color: #8A8073;">Aspirées</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Quelle lettre se lit « k » ?</span>
    <div style="display: flex; align-items: center; gap: 14px;">
      <b style="font-size: 52px; font-weight: 800; letter-spacing: -0.01em;">ka</b>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4C8C86" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <div style="height: 92px; border-radius: 16px; background: #EDF4F2; border: 2px solid #4C8C86; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <span class="ko" style="font-size: 34px; font-weight: 700; color: #2B2622; line-height: 1;">카</span>
      <span style="font-size: 11px; font-weight: 700; color: #3E736D;">ka</span>
    </div>
    <div style="height: 92px; border-radius: 16px; background: #FFFFFF; border: 2px solid #ECE3D7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <span class="ko" style="font-size: 34px; font-weight: 700; color: #2B2622; line-height: 1;">가</span>
      <span style="font-size: 11px; font-weight: 700; color: #8A8073;">ga</span>
    </div>
    <div style="height: 92px; border-radius: 16px; background: #FFFFFF; border: 2px solid #ECE3D7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <span class="ko" style="font-size: 34px; font-weight: 700; color: #2B2622; line-height: 1;">까</span>
      <span style="font-size: 11px; font-weight: 700; color: #8A8073;">kka</span>
    </div>
  </div>

  <div style="display: flex; gap: 11px; background: #EFE7DB; border-radius: 14px; padding: 14px 16px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F695F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4.5"/><circle cx="12" cy="8.2" r="0.9" fill="#6F695F"/></svg>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #6F695F;">La romanisation (révisée) est encore affichée sous chaque lettre. Elle s'effacera à mesure que tu lis.</p>
  </div>

  <div style="min-height: 52px; border-radius: 16px; background: #3E726D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Continuer</div>

</div>
</x-dc>
</body>
</html>
