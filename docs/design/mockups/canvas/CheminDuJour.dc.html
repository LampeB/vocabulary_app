<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E0A079; text-decoration: none; }
    a:hover { color: #F6DFCE; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #241F1B; box-sizing: border-box; padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #F6F1EA;">

  <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <b style="flex: 1; font-size: 16px; font-weight: 700;">Chemin du jour</b>
    <span style="font-size: 12.5px; color: #9A9086; font-variant-numeric: tabular-nums;">1/4</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">

    <div style="display: flex; align-items: center; gap: 13px; background: #2E2823; border: 1px solid #3D362F; border-radius: 16px; padding: 14px 15px; opacity: .68;">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: #2E4038; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9CC7B4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      </span>
      <span style="flex: 1; font-size: 14px; font-weight: 650; line-height: 1.35;">Réviser<br><span style="font-size: 11.5px; color: #9A9086; font-weight: 500;">12 mots dus · ~4 min</span></span>
      <span style="font-size: 12px; font-weight: 700; color: #6BA39D;">fait</span>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; background: #2E2823; border: 1.5px solid #D08358; border-radius: 16px; padding: 14px 15px;">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: #5A3B22; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E0A079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </span>
      <span style="flex: 1; font-size: 14px; font-weight: 650; line-height: 1.35;">Découvrir<br><span style="font-size: 11.5px; color: #9A9086; font-weight: 500;">7 nouveaux mots · Au café</span></span>
      <span style="font-size: 12px; font-weight: 800; color: #E0A079;">à toi</span>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; background: #2E2823; border: 1px solid #3D362F; border-radius: 16px; padding: 14px 15px;">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: #3A332C; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v15.5"/><path d="M6 17h13"/></svg>
      </span>
      <span style="flex: 1; font-size: 14px; font-weight: 650; line-height: 1.35;">Leçon<br><span style="font-size: 11.5px; color: #9A9086; font-weight: 500;">Le présent (-ar/-er/-ir) · ~3 min</span></span>
      <span style="font-size: 12px; font-weight: 700; color: #8A8073;">ensuite</span>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; background: #2E2823; border: 1px solid #3D362F; border-radius: 16px; padding: 14px 15px;">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: #3A332C; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <span style="flex: 1; font-size: 14px; font-weight: 650; line-height: 1.35;">Drill<br><span style="font-size: 11.5px; color: #9A9086; font-weight: 500;">Reconnaître · 8 items</span></span>
      <span style="font-size: 12px; font-weight: 700; color: #8A8073;">ensuite</span>
    </div>

  </div>

  <div style="display: flex; gap: 11px; background: #2E2823; border-radius: 14px; padding: 14px 15px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5l3 1.6"/></svg>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #9A9086;">Le chemin est figé au premier lancement du jour. Ce qui arrive à échéance ensuite attend demain.</p>
  </div>

  <div style="margin-top: auto; min-height: 50px; border-radius: 16px; border: 1.5px solid #4A4239; display: flex; align-items: center; justify-content: center; font-size: 14.5px; font-weight: 700; color: #B3A99C;">Revenir au parcours</div>

</div>
</x-dc>
</body>
</html>
