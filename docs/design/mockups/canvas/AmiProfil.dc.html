<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 18px 18px 32px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <b style="font-size: 16px; font-weight: 700;">Marie</b>
  </div>

  <div style="display: flex; align-items: center; gap: 16px;">
    <span style="width: 68px; height: 68px; border-radius: 50%; background: #D08358; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; flex-shrink: 0;">M</span>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <b style="font-size: 21px; font-weight: 800;">Marie</b>
      <span style="font-size: 13px; color: #756C62;">Vous apprenez ensemble depuis mars</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px;">
    <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 16px; padding: 13px 12px; display: flex; flex-direction: column; gap: 3px; align-items: center;">
      <b style="font-size: 20px; font-weight: 800; color: #C4703F; font-variant-numeric: tabular-nums;">18</b>
      <span style="font-size: 10.5px; font-weight: 700; color: #6F695F; text-align: center;">Série</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 16px; padding: 13px 12px; display: flex; flex-direction: column; gap: 3px; align-items: center;">
      <b style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums;">312</b>
      <span style="font-size: 10.5px; font-weight: 700; color: #6F695F; text-align: center;">Mots connus</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 16px; padding: 13px 12px; display: flex; flex-direction: column; gap: 3px; align-items: center;">
      <b style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums;">31</b>
      <span style="font-size: 10.5px; font-weight: 700; color: #6F695F; text-align: center;">Jours actifs</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Ses langues</span>
    <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 18px; padding: 4px 16px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #ECE3D7;">
        <span style="font-size: 22px; line-height: 1;">🇪🇸</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
          <b style="font-size: 14.5px; font-weight: 700;">Espagnol <span style="font-weight: 600; color: #756C62;">· Niveau 2</span></b>
          <div style="height: 6px; border-radius: 3px; background: #ECE3D7; overflow: hidden;">
            <div style="height: 100%; width: 62%; background: #4C8C86;"></div>
          </div>
        </div>
        <span style="font-size: 12px; font-weight: 700; color: #756C62; font-variant-numeric: tabular-nums;">12/20</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0;">
        <span style="font-size: 22px; line-height: 1;">🇯🇵</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
          <b style="font-size: 14.5px; font-weight: 700;">Japonais <span style="font-weight: 600; color: #756C62;">· Niveau 0</span></b>
          <div style="height: 6px; border-radius: 3px; background: #ECE3D7; overflow: hidden;">
            <div style="height: 100%; width: 24%; background: #D08358;"></div>
          </div>
        </div>
        <span style="font-size: 12px; font-weight: 700; color: #756C62; font-variant-numeric: tabular-nums;">L'écriture</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Vous deux</span>
    <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 18px; padding: 16px; display: flex; align-items: center; gap: 13px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4C8C86" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 6.5C10.5 5 8.5 4.5 4 4.5v13C8.5 17.5 10.5 18 12 19.5"/><path d="M12 6.5C13.5 5 15.5 4.5 20 4.5v13c-4.5 0-6.5.5-8 2"/></svg>
      <p style="margin: 0; flex: 1; font-size: 13.5px; line-height: 1.45; color: #756C62;">Vous apprenez tous les deux l'espagnol. Elle est sur le cluster <b style="color: #2B2622; font-weight: 700;">En ville</b>.</p>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <div style="min-height: 48px; border-radius: 16px; border: 1.5px dashed #DDD2C2; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #8A8073;">Défier — à définir (audit M9)</div>
    <div style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; color: #B0556B;">Retirer des amis</div>
  </div>

</div>
</x-dc>
</body>
</html>
