<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 18px 22px 30px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    <b style="flex: 1; font-size: 15px; font-weight: 700;">Écho · dernier pas</b>
    <span style="font-size: 11.5px; font-weight: 700; color: #8A8073;">non noté</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Retrouve le mot</span>
    <b style="font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em;">le pain</b>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="min-height: 56px; background: #FFFFFF; border: 2px solid #ECE3D7; border-radius: 14px; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
      <span style="flex: 1; font-size: 16.5px; font-weight: 650;">la leche</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    </div>
    <div style="min-height: 56px; background: #EDF4F2; border: 2px solid #4C8C86; border-radius: 14px; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
      <span style="flex: 1; font-size: 16.5px; font-weight: 700;">el pan</span>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3E736D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div style="min-height: 56px; background: #FFFFFF; border: 2px solid #ECE3D7; border-radius: 14px; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
      <span style="flex: 1; font-size: 16.5px; font-weight: 650;">el café</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    </div>
  </div>

  <div style="display: flex; gap: 11px; background: #EFE7DB; border-radius: 14px; padding: 14px 16px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F695F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4.5"/><circle cx="12" cy="8.2" r="0.9" fill="#6F695F"/></svg>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #6F695F;">Juste un écho des 7 mots que tu viens de voir. Rien n'est noté — ils entreront en révision demain.</p>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 7px;">
    <span style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 650; color: #756C62;">el pan ✓</span>
    <span style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 650; color: #756C62;">la leche ✓</span>
    <span style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 650; color: #B0A695;">el agua</span>
    <span style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 650; color: #B0A695;">la mesa</span>
  </div>

  <div style="margin-top: auto; min-height: 54px; border-radius: 16px; background: #A85A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Terminer</div>

</div>
</x-dc>
</body>
</html>
