<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 20px 22px 28px; display: flex; flex-direction: column; gap: 16px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <b style="flex: 1; font-size: 15px; font-weight: 700;">Le présent (-ar/-er/-ir)</b>
    <span style="display: flex; gap: 5px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #DDD2C2;"></span>
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #DDD2C2;"></span>
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #DDD2C2;"></span>
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #DDD2C2;"></span>
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #DDD2C2;"></span>
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #D08358;"></span>
    </span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center;">
    <svg width="86" height="86" viewBox="0 0 86 86" fill="none" aria-hidden="true">
      <circle cx="43" cy="43" r="34" fill="#EDF4F2"/>
      <circle cx="43" cy="43" r="34" stroke="#4C8C86" stroke-width="2.4"/>
      <path d="M30 44l9.5 9.5L57 34" stroke="#3E736D" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <b style="font-size: 25px; font-weight: 800; letter-spacing: -0.01em;">Leçon terminée</b>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #756C62; max-width: 30ch;">Tu sais conjuguer au présent pour « je », « tu » et « il / elle » — et repérer un irrégulier.</p>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 16px; padding: 15px 17px; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;">
      <span style="width: 38px; height: 38px; border-radius: 12px; background: #F6DFCE; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4703F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <span style="flex: 1;"><b style="font-size: 14px;">Prochaine étape : Reconnaître</b><br><span style="font-size: 12px; color: #756C62;">demain dans ton chemin · 8 items</span></span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="min-height: 54px; border-radius: 16px; background: #A85A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Terminé</div>
    <div style="min-height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 650; color: #756C62;">Relire la leçon</div>
  </div>

</div>
</x-dc>
</body>
</html>
