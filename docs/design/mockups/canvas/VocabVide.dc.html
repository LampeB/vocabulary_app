<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; display: flex; flex-direction: column; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 18px 10px;">
    <span style="display: inline-flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700;">FR ↔ ES</span>
    <span style="margin-left: auto; font-size: 14px; font-weight: 800; color: #C4703F;">🔥 1</span>
    <span style="width: 34px; height: 34px; border-radius: 50%; background: #4C8C86; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;">T</span>
  </div>

  <div style="flex: 1; padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 12px;">

    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Tes listes</span>

    <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 12px;">
      <span style="width: 11px; height: 11px; border-radius: 50%; background: #4C8C86; flex-shrink: 0;"></span>
      <span style="flex: 1; min-width: 0;">
        <b style="font-size: 14.5px;">La vie quotidienne</b>
        <span style="display: flex; align-items: center; gap: 7px; margin-top: 4px;">
          <span style="font-size: 9px; font-weight: 800; letter-spacing: 0.03em; background: #DCE9E6; color: #33635E; border-radius: 5px; padding: 2px 7px;">PARCOURS</span>
        </span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0;">
        <b style="font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums;">0/18</b>
        <span style="width: 46px; height: 5px; border-radius: 3px; background: #ECE3D7; display: block;"></span>
      </span>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 12px; text-align: center;">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <rect x="14" y="18" width="44" height="38" rx="6" stroke="#DDD2C2" stroke-width="2.5" stroke-dasharray="5 5"/>
        <path d="M26 32h20" stroke="#E3D9CB" stroke-width="3" stroke-linecap="round"/>
        <path d="M26 41h13" stroke="#E3D9CB" stroke-width="3" stroke-linecap="round"/>
        <circle cx="52" cy="50" r="12" fill="#F6F1EA"/>
        <circle cx="52" cy="50" r="11" stroke="#D08358" stroke-width="2.2"/>
        <path d="M52 45.5v9M47.5 50h9" stroke="#C4703F" stroke-width="2.6" stroke-linecap="round"/>
      </svg>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <b style="font-size: 18px; font-weight: 800;">Tes propres listes arrivent ici</b>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #756C62; max-width: 30ch;">Les listes du parcours sont fournies. Crée les tiennes pour ce que tu veux apprendre en plus — les mots de ton métier, ceux d'un voyage.</p>
      </div>

      <div style="display: inline-flex; align-items: center; gap: 8px; background: #A85A30; color: #FFFFFF; border-radius: 16px; padding: 14px 22px; font-size: 14.5px; font-weight: 700;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Créer ma première liste
      </div>
    </div>

  </div>

  <div style="display: flex; border-top: 1px solid #ECE3D7; background: #FBF8F3; padding: 8px 0 12px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C4703F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v15.5"/><path d="M6 17h13"/><path d="M6 21h13"/></svg>
      <span style="font-size: 9.5px; font-weight: 800; color: #C4703F;">Vocabulaire</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.5 5 8.5 4.5 4 4.5v13C8.5 17.5 10.5 18 12 19.5"/><path d="M12 6.5C13.5 5 15.5 4.5 20 4.5v13c-4.5 0-6.5.5-8 2"/></svg>
      <span style="font-size: 9.5px; font-weight: 700; color: #8A8073;">Leçons</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 17C14 16 16 12 17 8.5"/></svg>
      <span style="font-size: 9.5px; font-weight: 700; color: #8A8073;">Parcours</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-5 3.5 3.5L20 8"/><path d="M20 13V8h-5"/></svg>
      <span style="font-size: 9.5px; font-weight: 700; color: #8A8073;">Progrès</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6"/><path d="M17.5 19a5.5 5.5 0 0 0-2-4.3"/></svg>
      <span style="font-size: 9.5px; font-weight: 700; color: #8A8073;">Amis</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
