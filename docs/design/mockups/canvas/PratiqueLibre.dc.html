<div style="width: 390px; height: 844px; background: #8A8177; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Sens</span>
      <div style="display: flex; flex-wrap: wrap; gap: 7px;">
        <span style="border: 1.5px solid #4C8C86; background: #EDF4F2; color: #33635E; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 700;">Mixte</span>
        <span style="border: 1.5px solid #DDD2C2; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 650; color: #756C62;">ES → FR</span>

    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Mode</span>
      <div style="display: flex; flex-wrap: wrap; gap: 7px;">
        <span style="border: 1.5px solid #4C8C86; background: #EDF4F2; color: #33635E; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 700;">Cartes</span>
        <span style="border: 1.5px solid #DDD2C2; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 650; color: #756C62;">Écrire</span>
