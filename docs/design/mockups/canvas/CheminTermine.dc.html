<!doctype html>
<html>

</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E0A079; text-decoration: none; }
    a:hover { color: #F6DFCE; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #241F1B; box-sizing: border-box; padding: 40px 28px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; font-family: Figtree, system-ui, sans-serif; color: #F6F1EA; text-align: center;">

  <svg width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true">
    <circle cx="48" cy="48" r="38" fill="#2E4038"/>
    <circle cx="48" cy="48" r="38" stroke="#4C8C86" stroke-width="2.5"/>
    <path d="M33 49l11 11 20-22" stroke="#9CC7B4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="26" r="3.5" fill="#E0A079"/>
    <circle cx="82" cy="34" r="2.8" fill="#6BA39D"/>
    <circle cx="76" cy="74" r="3.2" fill="#E0A079"/>
    <circle cx="19" cy="70" r="2.4" fill="#6BA39D"/>
  </svg>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -0.01em;">Journée complète.</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #CFC6BA; max-width: 28ch;">Les quatre étapes sont faites. Rien d'autre n'est dû aujourd'hui — repose-toi, ça compte aussi.</p>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; background: #2E2823; border-radius: 999px; padding: 12px 22px;">
    <span style="font-size: 20px;">🔥</span>
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <b style="font-size: 26px; font-weight: 800; color: #E0A079; font-variant-numeric: tabular-nums;">13</b>
      <span style="font-size: 13.5px; font-weight: 650; color: #CFC6BA;">jours d'affilée</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 8px;">
    <div style="min-height: 52px; border-radius: 16px; background: #A85A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Continuer</div>
    <div style="min-height: 48px; border-radius: 16px; border: 1.5px solid #4A4239; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 650; color: #B3A99C;">Pratique libre en bonus</div>
  </div>

</div>
