<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="height: 5px; border-radius: 3px; background: #ECE3D7; overflow: hidden;">
    <div style="height: 100%; width: 50%; background: #4C8C86;"></div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; height: 40px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    <b style="flex: 1; font-size: 15px; font-weight: 700;">Réviser · 6/12</b>
    <span style="font-size: 11.5px; font-weight: 700; color: #8A8073;">en contexte</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px;">

    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Complète la phrase</span>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 25px; font-weight: 700; line-height: 1.5;">
      <span>Un</span>
      <span style="min-width: 104px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 2px dashed #D08358; display: inline-block;"></span>
      <span>y un pan,</span>
      <span>por favor.</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4C8C86" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <span style="font-size: 14.5px; color: #756C62;">Un café et un pain, s'il vous plaît.</span>
    </div>

  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 10px;">
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 12px 18px; font-size: 16.5px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">café</span>
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 12px 18px; font-size: 16.5px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">leche</span>
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 12px 18px; font-size: 16.5px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">agua</span>
    <span style="background: #FFFFFF; border: 1.5px solid #DDD2C2; border-radius: 12px; padding: 12px 18px; font-size: 16.5px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">mesa</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; font-weight: 650; color: #8A8073;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8073" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M14.5 4.5l5 5L9 20H4v-5z"/></svg>
    ou écrire la réponse
  </div>

  <div style="min-height: 52px; border-radius: 16px; background: #3E726D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Vérifier</div>

</div>
</x-dc>
</body>
</html>
