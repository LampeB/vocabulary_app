<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 28px 24px 32px; display: flex; flex-direction: column; gap: 22px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="display: flex; align-items: center; gap: 14px; height: 44px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="display: flex; gap: 6px;">
      <span style="width: 22px; height: 4px; border-radius: 2px; background: #C4703F;"></span>
      <span style="width: 22px; height: 4px; border-radius: 2px; background: #ECE3D7;"></span>
      <span style="width: 22px; height: 4px; border-radius: 2px; background: #ECE3D7;"></span>
      <span style="width: 22px; height: 4px; border-radius: 2px; background: #ECE3D7;"></span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 27px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance;">Quelle langue veux-tu apprendre&nbsp;?</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #756C62;">Tu pourras en ajouter d'autres plus tard.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="height: 88px; border-radius: 16px; background: #FFFFFF; border: 2px solid #4C8C86; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
      <span style="font-size: 26px; line-height: 1;">🇪🇸</span>
      <span style="font-size: 14px; font-weight: 700;">Espagnol</span>
    </div>
    <div style="height: 88px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECE3D7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
      <span style="font-size: 26px; line-height: 1;">🇰🇷</span>
      <span style="font-size: 14px; font-weight: 700;">Coréen</span>
    </div>
    <div style="height: 88px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECE3D7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
      <span style="font-size: 26px; line-height: 1;">🇬🇧</span>
      <span style="font-size: 14px; font-weight: 700;">Anglais</span>
    </div>
    <div style="height: 88px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECE3D7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
      <span style="font-size: 26px; line-height: 1;">🇮🇹</span>
      <span style="font-size: 14px; font-weight: 700;">Italien</span>
    </div>
    <div style="height: 88px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECE3D7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
      <span style="font-size: 26px; line-height: 1;">🇩🇪</span>
      <span style="font-size: 14px; font-weight: 700;">Allemand</span>
    </div>
    <div style="height: 88px; border-radius: 16px; background: #FFFFFF; border: 1px solid #ECE3D7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
      <span style="font-size: 26px; line-height: 1;">🇫🇷</span>
      <span style="font-size: 14px; font-weight: 700;">Français</span>
    </div>
  </div>

  <div style="margin-top: auto; height: 54px; border-radius: 16px; background: #A85A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Continuer</div>

</div>
</x-dc>
</body>
</html>
