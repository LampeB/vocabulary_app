<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    .ko { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="height: 5px; border-radius: 3px; background: #ECE3D7; overflow: hidden;">
    <div style="height: 100%; width: 82%; background: #4C8C86;"></div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; height: 40px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    <b style="flex: 1; font-size: 15px; font-weight: 700;">Construire · 9/11</b>
    <span style="font-size: 11.5px; font-weight: 700; color: #8A8073;">Syllabes</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Compose la syllabe</span>
    <b style="font-size: 30px; line-height: 1.2; font-weight: 800;">han</b>
    <p style="margin: 0; font-size: 13px; color: #756C62;">Une consonne, une voyelle, puis la finale.</p>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 18px; padding: 20px; display: flex; align-items: center; justify-content: center; gap: 14px;">
    <span class="ko" style="width: 58px; height: 58px; border-radius: 12px; background: #F6DFCE; border: 2px solid #D08358; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700;">ㅎ</span>
    <span style="font-size: 20px; font-weight: 700; color: #B0A695;">+</span>
    <span class="ko" style="width: 58px; height: 58px; border-radius: 12px; background: #F6DFCE; border: 2px solid #D08358; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700;">ㅏ</span>
    <span style="font-size: 20px; font-weight: 700; color: #B0A695;">+</span>
    <span style="width: 58px; height: 58px; border-radius: 12px; background: #F6F1EA; border: 2px dashed #DDD2C2; display: flex; align-items: center; justify-content: center;"></span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B0A695" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    <span class="ko" style="font-size: 40px; font-weight: 700; color: #B0A695;">하</span>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
    <span class="ko" style="width: 56px; height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #DDD2C2; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">ㄴ</span>
    <span class="ko" style="width: 56px; height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #DDD2C2; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">ㅇ</span>
    <span class="ko" style="width: 56px; height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #DDD2C2; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">ㅁ</span>
    <span class="ko" style="width: 56px; height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #DDD2C2; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">ㄹ</span>
    <span class="ko" style="width: 56px; height: 56px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #DDD2C2; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; box-shadow: 0 1px 0 rgba(43,38,34,.05);">ㅅ</span>
  </div>

  <div style="display: flex; gap: 11px; background: #EFE7DB; border-radius: 14px; padding: 14px 16px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F695F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4.5"/><circle cx="12" cy="8.2" r="0.9" fill="#6F695F"/></svg>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #6F695F;">Les intrus sont d'autres finales plausibles (ㅇ, ㅁ, ㄹ, ㅅ) : il faut vraiment entendre la syllabe, pas deviner par la forme.</p>
  </div>

  <div style="margin-top: auto; min-height: 52px; border-radius: 16px; background: #3E726D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Vérifier</div>

</div>
</x-dc>
</body>
</html>
