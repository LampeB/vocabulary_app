<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="height: 5px; border-radius: 3px; background: #ECE3D7; overflow: hidden;">
    <div style="height: 100%; width: 88%; background: #4C8C86;"></div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; height: 40px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    <b style="flex: 1; font-size: 15px; font-weight: 700;">Écrire</b>
    <span style="font-size: 11px; font-weight: 800; color: #A85B28; background: #F6DFCE; border-radius: 999px; padding: 4px 11px;">Palier P3</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Écris la phrase en espagnol</span>
    <b style="font-size: 20px; line-height: 1.35; font-weight: 700;">« Je vais à l'école. »</b>
  </div>

  <div style="border: 2px solid #D08358; border-radius: 14px; background: #FFFFFF; padding: 15px 16px; min-height: 58px; display: flex; align-items: center;">
    <span style="font-size: 16.5px; font-weight: 650;">Voy a la escuel</span><span style="width: 2px; height: 21px; background: #C4703F; margin-left: 1px;"></span>
  </div>

  <div style="display: flex; gap: 11px; background: #EFE7DB; border-radius: 14px; padding: 14px 16px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F695F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><path d="M4 20h16"/><path d="M14.5 4.5l5 5L9 20H4v-5z"/></svg>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: #6F695F;">Plus de chips. L'échafaudage est retiré — la règle est à toi. Les accents et majuscules sont tolérés.</p>
  </div>

  <div style="margin-top: auto; min-height: 52px; border-radius: 16px; background: #3E726D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Vérifier</div>

</div>
</x-dc>
</body>
</html>
