<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C4703F; text-decoration: none; }
    a:hover { color: #A85A30; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F1EA; box-sizing: border-box; padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 18px; font-family: Figtree, system-ui, sans-serif; color: #2B2622;">

  <div style="display: flex; align-items: center; gap: 12px; height: 44px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#756C62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    <b style="flex: 1; font-size: 15px; font-weight: 700;">Découvrir · 2/7</b>
    <span style="font-size: 11.5px; font-weight: 700; color: #8A8073;">Au café</span>
  </div>

  <div style="display: flex; gap: 5px;">
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #D08358;"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #D08358;"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #ECE3D7;"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #ECE3D7;"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #ECE3D7;"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #ECE3D7;"></span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #ECE3D7;"></span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
    <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #6F695F;">Nouveau mot · jamais noté</span>

    <div style="display: flex; align-items: center; gap: 13px;">
      <b style="font-size: 36px; font-weight: 800; letter-spacing: -0.01em;">el pan</b>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4C8C86" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
    </div>

    <span style="font-size: 21px; font-weight: 650; color: #756C62;">le pain</span>

    <div style="background: #FFFFFF; border: 1px solid #ECE3D7; border-radius: 16px; padding: 15px 17px; width: 100%; display: flex; flex-direction: column; gap: 5px;">
      <span style="font-size: 15px; font-weight: 650; line-height: 1.4;">Un café y <b style="background: #F6DFCE; color: #A85B28; border-radius: 4px; padding: 0 3px;">un pan</b>, por favor.</span>
      <span style="font-size: 12.5px; color: #756C62;">Un café et un pain, s'il vous plaît.</span>
    </div>

    <span style="font-size: 13px; color: #8A8073; text-align: center; max-width: 30ch; line-height: 1.45;">Premier contact : on regarde, on écoute. Rien à prouver pour l'instant.</span>
  </div>

  <div style="min-height: 54px; border-radius: 16px; background: #A85A30; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 700;">Suivant</div>

</div>
</x-dc>
</body>
</html>
