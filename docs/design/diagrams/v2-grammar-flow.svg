<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#756C62" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1060" height="560" fill="#F6F1EA"/>
  <text x="30" y="42" font-size="21" font-weight="700" fill="#2B2622">Flux grammaire v2 — groupes de petites règles</text>
  <text x="30" y="64" font-size="13" fill="#756C62">vocabulaire prérequis maîtrisé → règles une à une → Mélange → groupe suivant → examen de palier</text>

  <!-- prerequisite gate -->
  <rect x="30" y="110" width="210" height="170" rx="16" fill="#EFE7DB"/>
  <text x="52" y="140" font-size="13" fill="#2B2622" font-weight="700">🔒 Prérequis du groupe</text>
  <text x="52" y="160" font-size="11.5" fill="#756C62">listes de vocab à MAÎTRISER</text>
  <text x="52" y="188" font-size="11.5" fill="#2B2622">La maison</text>
  <rect x="52" y="196" width="120" height="5" rx="2.5" fill="#ECE3D7"/>
  <rect x="52" y="196" width="120" height="5" rx="2.5" fill="#4C8C86"/>
  <text x="182" y="201" font-size="10.5" fill="#3E726D">100 %</text>
  <text x="52" y="222" font-size="11.5" fill="#2B2622">Les courses</text>
  <rect x="52" y="230" width="120" height="5" rx="2.5" fill="#ECE3D7"/>
  <rect x="52" y="230" width="98" height="5" rx="2.5" fill="#D08358"/>
  <text x="182" y="235" font-size="10.5" fill="#C4703F">82 %</text>
  <text x="52" y="262" font-size="10.5" fill="#8A8073">des listes différentes par</text>
  <text x="52" y="276" font-size="10.5" fill="#8A8073">groupe et par niveau</text>
  <line x1="240" y1="195" x2="268" y2="195" stroke="#756C62" stroke-width="1.8" marker-end="url(#g)"/>

  <!-- group container -->
  <rect x="270" y="96" width="530" height="300" rx="18" fill="#FFFFFF" stroke="#D08358" stroke-width="1.8"/>
  <text x="288" y="124" font-size="13.5" fill="#2B2622" font-weight="700">GROUPE 2 · Les particules de base</text>
  <text x="782" y="124" font-size="12" fill="#C4703F" text-anchor="end" font-weight="700">2/5 règles · Mélange ○</text>

  <rect x="288" y="140" width="90" height="64" rx="12" fill="#F6F1EA" stroke="#ECE3D7"/>
  <text x="333" y="164" font-size="12.5" fill="#2B2622" text-anchor="middle" font-weight="700">은/는 ✓</text>
  <text x="333" y="186" font-size="11" fill="#3E726D" text-anchor="middle">● ● ●</text>
  <line x1="378" y1="172" x2="386" y2="172" stroke="#756C62" stroke-width="1.4"/>
  <rect x="388" y="140" width="90" height="64" rx="12" fill="#F6F1EA" stroke="#ECE3D7"/>
  <text x="433" y="164" font-size="12.5" fill="#2B2622" text-anchor="middle" font-weight="700">이/가 ✓</text>
  <text x="433" y="186" font-size="11" fill="#3E726D" text-anchor="middle">● ● ●</text>
  <line x1="478" y1="172" x2="486" y2="172" stroke="#756C62" stroke-width="1.4"/>
  <rect x="488" y="140" width="90" height="64" rx="12" fill="#D08358"/>
  <text x="533" y="164" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">을/를 ▸</text>
  <text x="533" y="186" font-size="11" fill="#FBEADF" text-anchor="middle">● ● ○</text>
  <line x1="578" y1="172" x2="586" y2="172" stroke="#756C62" stroke-width="1.4"/>
  <rect x="588" y="140" width="90" height="64" rx="12" fill="#FFFFFF" stroke="#ECE3D7"/>
  <text x="633" y="164" font-size="12.5" fill="#8A8073" text-anchor="middle" font-weight="700">에 🔒</text>
  <text x="633" y="186" font-size="11" fill="#8A8073" text-anchor="middle">○ ○ ○</text>
  <line x1="678" y1="172" x2="686" y2="172" stroke="#756C62" stroke-width="1.4"/>
  <rect x="688" y="140" width="90" height="64" rx="12" fill="#FFFFFF" stroke="#ECE3D7"/>
  <text x="733" y="164" font-size="12.5" fill="#8A8073" text-anchor="middle" font-weight="700">에서 🔒</text>
  <text x="733" y="186" font-size="11" fill="#8A8073" text-anchor="middle">○ ○ ○</text>

  <text x="535" y="230" font-size="11.5" fill="#756C62" text-anchor="middle">une petite règle = leçon courte (3-6 pages) → J+1 Reconnaître (QCM) → J+2 Construire  ⇒  ● ● ●</text>

  <line x1="535" y1="240" x2="535" y2="252" stroke="#756C62" stroke-width="1.6" marker-end="url(#g)"/>
  <rect x="288" y="256" width="490" height="112" rx="14" fill="#D08358" opacity="0.13"/>
  <rect x="288" y="256" width="490" height="112" rx="14" fill="none" stroke="#D08358" stroke-width="1.6"/>
  <text x="533" y="284" font-size="13.5" fill="#C4703F" text-anchor="middle" font-weight="700">Mélange — apprendre à combiner les 5</text>
  <text x="533" y="308" font-size="11.5" fill="#2B2622" text-anchor="middle">leçon de combinaison (interactions, confusions fréquentes)</text>
  <text x="533" y="326" font-size="11.5" fill="#2B2622" text-anchor="middle">+ exercices mixtes : Écrire · Parler · cloze combinés (anciennes étapes 4-5)</text>
  <text x="533" y="350" font-size="11.5" fill="#3E726D" text-anchor="middle" font-weight="600">réussi → groupe ✓ · les règles passent en entretien (cloze/dialogues)</text>

  <!-- next group + exam -->
  <line x1="800" y1="177" x2="828" y2="177" stroke="#756C62" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="830" y="150" width="200" height="54" rx="14" fill="#FFFFFF" stroke="#ECE3D7" stroke-dasharray="6 4"/>
  <text x="930" y="173" font-size="12.5" fill="#8A8073" text-anchor="middle" font-weight="700">Groupe 3 🔒 · …</text>
  <text x="930" y="191" font-size="10.5" fill="#8A8073" text-anchor="middle">ses propres prérequis vocab</text>
  <line x1="930" y1="204" x2="930" y2="256" stroke="#756C62" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="944" y="234" font-size="10.5" fill="#756C62">tous les groupes ✓</text>
  <rect x="830" y="260" width="200" height="100" rx="16" fill="#2B2622"/>
  <text x="930" y="290" font-size="13" fill="#F6F1EA" text-anchor="middle" font-weight="700">Examen de palier</text>
  <text x="930" y="310" font-size="11" fill="#CFC6BA" text-anchor="middle">Test de niveau (S17)</text>
  <text x="930" y="332" font-size="11" fill="#CFC6BA" text-anchor="middle">échantillonne tous les groupes</text>
  <text x="930" y="348" font-size="11" fill="#E0A079" text-anchor="middle">réussi → niveau suivant</text>

  <!-- notes -->
  <rect x="30" y="420" width="323" height="112" rx="14" fill="#EFE7DB"/>
  <text x="48" y="446" font-size="12.5" fill="#2B2622" font-weight="700">Cadence — jamais de flood</text>
  <text x="48" y="467" font-size="11.5" fill="#756C62">un seul groupe actif par langue ;</text>
  <text x="48" y="484" font-size="11.5" fill="#756C62">1-2 étapes grammaire par jour ; &lt; 80 % à un</text>
  <text x="48" y="501" font-size="11.5" fill="#756C62">exercice → retenté demain, jamais d'écran rouge.</text>

  <rect x="368" y="420" width="323" height="112" rx="14" fill="#EFE7DB"/>
  <text x="386" y="446" font-size="12.5" fill="#2B2622" font-weight="700">La porte est une vraie porte</text>
  <text x="386" y="467" font-size="11.5" fill="#756C62">groupe atteint mais vocab pas maîtrisé →</text>
  <text x="386" y="484" font-size="11.5" fill="#756C62">le chemin du jour sert ces révisions jusqu'à</text>
  <text x="386" y="501" font-size="11.5" fill="#756C62">l'ouverture ; barres visibles (S9 + parcours).</text>

  <rect x="706" y="420" width="324" height="112" rx="14" fill="#EFE7DB"/>
  <text x="724" y="446" font-size="12.5" fill="#2B2622" font-weight="700">Sans micro — jamais bloquant</text>
  <text x="724" y="467" font-size="11.5" fill="#756C62">le Mélange peut se conclure à l'Écrire :</text>
  <text x="724" y="484" font-size="11.5" fill="#756C62">« maîtrisé (écrit) » ; Parler reste proposé</text>
  <text x="724" y="501" font-size="11.5" fill="#756C62">mais ne bloque ni le groupe ni l'examen.</text>
</svg>
