  <text x="240" y="744" font-size="13" fill="#8A8073" text-anchor="middle">B2 · C1 · C2 …</text>

  <!-- annotations -->
  <line x1="432" y1="115" x2="512" y2="112" stroke="#756C62" stroke-width="1"/>
  <text x="520" y="108" font-size="12.5" fill="#2B2622">Sélecteur de langue — dernière étudiée par défaut ;</text>
  <text x="520" y="126" font-size="12.5" fill="#2B2622">série + avatar (→ Profil &amp; Paramètres) dans l'en-tête.</text>

  <line x1="432" y1="210" x2="512" y2="196" stroke="#756C62" stroke-width="1"/>
  <text x="520" y="192" font-size="12.5" fill="#2B2622" font-weight="700">Carte aperçu = « aujourd'hui »</text>
  <text x="520" y="210" font-size="12.5" fill="#2B2622">Position CEFR + étapes du jour + LE bouton Continuer</text>
  <text x="520" y="228" font-size="12.5" fill="#2B2622">(boucle F0). Le bilan hebdo se glisse au-dessus le dimanche.</text>

  <line x1="432" y1="318" x2="512" y2="314" stroke="#756C62" stroke-width="1"/>
  <text x="520" y="318" font-size="12.5" fill="#2B2622">Niveau terminé — replié, ✓ x/x ; s'ouvre au tap.</text>

  <line x1="432" y1="505" x2="512" y2="474" stroke="#756C62" stroke-width="1"/>
  <text x="520" y="460" font-size="12.5" fill="#2B2622" font-weight="700">Fenêtre de 5 leçons centrée sur la courante</text>
