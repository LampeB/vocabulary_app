  <text x="520" y="496" font-size="12.5" fill="#2B2622">· 2 à venir 🔒. Un tap lance directement F2 (vocab)</text>
  <text x="520" y="514" font-size="12.5" fill="#2B2622">ou F3 (grammaire) — aucun écran de réglage.</text>
  <text x="520" y="532" font-size="12.5" fill="#756C62">« Voir les 20 leçons » : liste complète (inline ou sheet — Q5).</text>

  <line x1="432" y1="630" x2="512" y2="622" stroke="#756C62" stroke-width="1"/>
  <text x="520" y="618" font-size="12.5" fill="#2B2622" font-weight="700">Dernier nœud : test de passage (S17)</text>
  <text x="520" y="636" font-size="12.5" fill="#2B2622">verrouillé jusqu'à 20/20 — le réussir (maîtrise) ouvre B1.</text>

  <line x1="432" y1="690" x2="512" y2="684" stroke="#756C62" stroke-width="1"/>
  <text x="520" y="680" font-size="12.5" fill="#2B2622">Niveau verrouillé — le même test sert de placement :</text>
  <text x="520" y="698" font-size="12.5" fill="#2B2622">« Je connais déjà ce niveau ? » permet de sauter.</text>
