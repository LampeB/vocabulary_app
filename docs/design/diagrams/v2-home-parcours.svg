  <text x="402" y="517" font-size="11.5" fill="#FBEADF" text-anchor="end" font-weight="700">Commencer</text>
  <rect x="66" y="534" width="348" height="36" rx="10" fill="#FFFFFF" stroke="#ECE3D7"/>
  <text x="84" y="557" font-size="12.5" fill="#8A8073">14 🔒</text>
  <text x="132" y="557" font-size="12.5" fill="#8A8073">Vocabulaire · Les courses</text>
  <rect x="66" y="574" width="348" height="36" rx="10" fill="#FFFFFF" stroke="#ECE3D7"/>
