name: Tests (unit + widget + integration)

# Fast host-side test suite — runs on the CI runner (no emulator), so it's quick
# and reliable. Covers unit, widget, and drift-in-memory integration tests.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      # drift's integration tests use the native sqlite3 library.
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true

      - run: flutter pub get

      - run: flutter test --coverage

      - name: Test opted-in debug diagnostics
        run: |
          flutter test --dart-define=STT_DIAGNOSTICS=true \
            test/unit/speech/stt_corpus_recorder_test.dart \
            test/widget/screens/near_miss_session_screen_test.dart \
            test/widget/screens/settings_screen_test.dart \
            test/widget/screens/stt_diagnostics_navigation_test.dart

      # Coverage floor (Phases 5+8 of docs/test-coverage-roadmap.md). Measured
      # 49.7% on 2026-07-03 after the Phase 8 push; the floor leaves ~2 points
      # of slack so unrelated work isn't blocked, while a test-deleting PR
      # fails. Raise the floor when coverage grows; never lower it to pass.
      - name: Report coverage (floor 47.5%)
        run: |
          pct=$(LC_ALL=C awk -F, '/^DA:/ {t++; if ($2 > 0) h++} END {printf "%.1f", 100 * h / t}' coverage/lcov.info)
          echo "Total line coverage: ${pct}%"
          echo "### Line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          if LC_ALL=C awk "BEGIN {exit !($pct < 47.5)}"; then
            echo "::error::Line coverage ${pct}% fell below the 47.5% floor (see docs/test-coverage-roadmap.md Phase 5)"
            exit 1
          fi

      - name: Upload lcov report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: coverage/lcov.info
