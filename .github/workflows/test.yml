name: Tests (unit + widget + integration)

# Fast host-side test suite — runs on the CI runner (no emulator), so it's quick
# and reliable. Covers unit, widget, and drift-in-memory integration tests.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # drift's integration tests use the native sqlite3 library.
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test --coverage

      # Print total line coverage (plain awk over lcov.info — no lcov dependency).
      # Informational for now; a floor gate is planned for Phase 5 of
      # docs/test-coverage-roadmap.md once Phases 2-4 have landed.
      - name: Report coverage
        run: |
          pct=$(LC_ALL=C awk -F, '/^DA:/ {t++; if ($2 > 0) h++} END {printf "%.1f", 100 * h / t}' coverage/lcov.info)
          echo "Total line coverage: ${pct}%"
          echo "### Line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
