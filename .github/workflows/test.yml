name: Tests (unit + widget + integration)

# Fast host-side test suite — runs on the CI runner (no emulator), so it's quick
# and reliable. Covers unit, widget, and drift-in-memory integration tests.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # drift's integration tests use the native sqlite3 library.
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test --coverage

      # Coverage floor (Phase 5 of docs/test-coverage-roadmap.md). Measured
      # 45.8% on 2026-07-03 after Phases 1-4; the floor leaves ~2 points of
      # slack so unrelated work isn't blocked, while a test-deleting PR fails.
      # Raise the floor when coverage grows; never lower it to make CI pass.
      - name: Report coverage (floor 43.5%)
        run: |
          pct=$(LC_ALL=C awk -F, '/^DA:/ {t++; if ($2 > 0) h++} END {printf "%.1f", 100 * h / t}' coverage/lcov.info)
          echo "Total line coverage: ${pct}%"
          echo "### Line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          if LC_ALL=C awk "BEGIN {exit !($pct < 43.5)}"; then
            echo "::error::Line coverage ${pct}% fell below the 43.5% floor (see docs/test-coverage-roadmap.md Phase 5)"
            exit 1
          fi

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
