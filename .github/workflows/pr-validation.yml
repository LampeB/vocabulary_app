name: Pull request validation
run-name: 'PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} against ${{ github.event.pull_request.base.sha }}'

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: PR / Flutter quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce PR policy
        run: pwsh -NoProfile -File tool/check-pr-policy.ps1 -BaseRef '${{ github.event.pull_request.base.sha }}'

      - name: Enforce Whisper license boundary
        run: pwsh -NoProfile -File tool/check-whisper-license.ps1

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Test opted-in debug diagnostics and product-mode denial
        run: |
          flutter test --dart-define=STT_DIAGNOSTICS=true \
            test/unit/speech/stt_corpus_recorder_test.dart \
            test/widget/screens/near_miss_session_screen_test.dart \
            test/widget/screens/settings_screen_test.dart \
            test/widget/screens/stt_diagnostics_navigation_test.dart
          dart compile exe -DSTT_DIAGNOSTICS=true \
            test/helpers/check_release_stt_diagnostics.dart -o "$RUNNER_TEMP/stt-release-gate"
          "$RUNNER_TEMP/stt-release-gate"

      - name: Enforce coverage floor
        run: pwsh -NoProfile -File tool/check-coverage.ps1

  provider-boundaries:
    name: PR / Provider boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.11@sha256:468e1f126ca5af849799cda06ac9b03d8090aae9fa5163408b3e8da44fad0702
        env:
          POSTGRES_PASSWORD: postgres-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: Verify frozen Edge bundles and request boundaries
        run: python3 tool/deploy-edge-functions.py
      - name: Test versioned Edge deployment inputs
        run: python3 -m unittest discover -s tool -p 'test_deploy_edge_functions.py'
      - name: Verify E2E credentials are scoped to each Patrol target
        run: python3 -m unittest discover -s tool/e2e -p 'test_*.py'
      - name: Verify the seed publisher stops at redirects
        run: node --test tool/test_generate_seed_audio.mjs
      - name: Test validated PR approval gates
        run: python3 -m unittest discover -s tool -p 'test_approve_validated_pr.py'
      - name: Test path guards and the installed Unix Git hook
        run: python3 -m unittest discover -s tool -p 'test_check_pr_policy.py'
      - name: Test quotas, RLS and concurrent reset on disposable PostgreSQL
        env:
          PGPASSWORD: postgres-test-only
          PGUSER: postgres
          PGHOST: localhost
          PGDATABASE: ponderin_security_test
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ponderin_security_test'
          psql -v ON_ERROR_STOP=1 -f supabase/tests/security_bootstrap.sql
          for migration in 000_complete_setup 004_generic_language_pairs 005_list_origin 006_variant_examples_and_seed_ids 007_audio_storage; do
            psql -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}.sql"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/audio_storage_before_activation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/audio_storage_write_boundaries.sql
          for migration in 008_e2e_reset 009_e2e_scenario_accounts 010_provider_quota_buckets 011_sync_identity 012_security_boundaries 013_e2e_isolation 014_vocabulary_tombstones 015_vocabulary_owner_namespace 016_vocabulary_write_order add_subscription_type; do
            psql -v ON_ERROR_STOP=1 -f "supabase/migrations/${migration}.sql"
            case "$migration" in
              009_*|012_*|013_*|014_*|015_*) psql -v ON_ERROR_STOP=1 -f supabase/tests/e2e_reset_before_activation.sql ;;
            esac
          done
          for test in provider_quota security_boundaries audio_storage_write_boundaries reset_e2e_account e2e_scenario_accounts e2e_isolation vocabulary_tombstones vocabulary_owner_namespace vocabulary_write_order; do
            psql -v ON_ERROR_STOP=1 -f "supabase/tests/${test}.sql"
          done
          bash supabase/tests/reset_concurrency.sh

  android-build:
    name: PR / Android native build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      # No credentials or deployment: exercise Dart, Gradle, CMake and native
      # linking on every proposed merge, including the pinned Whisper engine.
      - run: flutter build apk --debug

  ios-simulator-build:
    name: PR / iOS simulator build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      - name: Compile the iOS simulator app without signing
        run: flutter build ios --simulator --debug --no-codesign

  dependency-review:
    name: PR / Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  secrets:
    name: PR / Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-security:
    name: PR / Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl --fail --location --silent --show-error \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz
          echo '233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4  actionlint.tar.gz' | sha256sum --check --status
          tar --extract --gzip --file actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Lint all workflows
        run: ./actionlint

      - name: Audit all workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows/
          version: 1.32.0
          online-audits: false
          advanced-security: false
          annotations: true
