name: Validate release APK build

# Manual trigger only — run it from the Actions tab once the two secrets below
# are set (Settings → Secrets and variables → Actions):
#   SUPABASE_URL        e.g. https://<project>.supabase.co
#   SUPABASE_ANON_KEY   the project's anon/publishable key
# RevenueCat is left as a placeholder (not set up yet).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true

      - name: Write build-time secrets to .env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 -c 'import json,os; json.dump({key: os.environ[key] for key in ("SUPABASE_URL", "SUPABASE_ANON_KEY")}, open(".env.json", "w"))'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=.env.json
