name: Approve validated pull request

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number
        required: true
        type: string
      expected_head:
        description: Full SHA of the reviewed pull request head
        required: true
        type: string

permissions: {}

concurrency:
  group: approve-validated-pr-${{ inputs.pull_number }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      checks: read
      statuses: read
      pull-requests: write
    steps:
      - name: Verify the exact dispatch ref
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify evidence and submit approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_PULL_NUMBER: ${{ inputs.pull_number }}
          APPROVAL_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: python3 tool/approve_validated_pr.py
