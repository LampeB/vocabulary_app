name: E2E (emulator)

# Runs the Patrol app E2E suite on an Android emulator on GitHub's cloud runners —
# no local machine or phone needed. Nightly on the default branch, or manual.
#
# Requires the main-only patrol-e2e environment secret E2E_ACCOUNTS_JSON
# and repo secrets SUPABASE_URL, SUPABASE_ANON_KEY.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Patrol target — a single _test.dart file for a quick run; default runs 9 suites with up to 3 parallel jobs'
        default: 'all'
        required: false

# Permanent per-scenario accounts: serialize runs of the same scenario.
concurrency:
  group: supabase-e2e-account
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  suites:
    if: github.ref == 'refs/heads/main' && vars.PATROL_E2E_ACTIVATION == 'isolated-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify hosted isolation before any Patrol suite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 tool/e2e/check_activation.py
      - id: select
        env:
          E2E_TARGET: ${{ inputs.target || 'all' }}
        run: python3 tool/e2e/matrix.py

  e2e:
    needs: suites
    if: github.ref == 'refs/heads/main' && vars.PATROL_E2E_ACTIVATION == 'isolated-v1'
    environment: patrol-e2e
    name: E2E (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.suites.outputs.matrix) }}
    env:
      E2E_TARGET: ${{ matrix.target }}
    # Independent budget per suite, including setup and a cold Android build.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true

      - run: flutter pub get

      # Patrol 4.6.1 requires CLI 4.4.0; do not install the latest implicitly.
      - run: dart pub global activate patrol_cli 4.4.0

      - name: Validate distinct scenario accounts and write build-time config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
        run: python3 tool/e2e/prepare.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Patrol E2E on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          # Use a script so manual input is never interpolated into shell code.
          script: bash tool/e2e/run.sh

      - name: Collect sanitized Android reports
        if: always()
        run: python3 tool/e2e/collect_reports.py

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-reports-${{ strategy.job-index }}
          path: e2e-reports/
          retention-days: 7

      - name: Remove generated credentials
        if: always()
        run: rm -f .env.json
