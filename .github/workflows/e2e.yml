name: E2E (emulator)

# Runs the Patrol app E2E suite on an Android emulator on GitHub's cloud runners —
# no local machine or phone needed. Nightly on the default branch, or manual.
#
# Requires repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY, E2E_ACCOUNTS_JSON.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Patrol target — a single _test.dart file for a quick run; default runs the 9 suites sequentially'
        default: 'all'
        required: false

# Permanent per-scenario accounts: serialize runs of the same scenario across branches.
concurrency:
  group: supabase-e2e-account
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_TARGET: ${{ inputs.target || 'all' }}
    # clearPackageData isolates each test (fresh process + sign-in), so there's no
    # cross-test accumulation — but a per-test app spawn occasionally dies
    # silently. The suites therefore run as 9 separate patrol invocations, each
    # with its own capped-and-retried attempts (see the script below). A clean
    # full pass is ~35 min incl. boot; 60 min leaves room for several retries.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Patrol CLI. If this version mismatches the `patrol` package (4.6.x), pin
      # it here to the compatible release.
      - run: dart pub global activate patrol_cli

      - name: Validate distinct scenario accounts and write build-time config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
        run: python3 tool/e2e/prepare.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Patrol E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          # Use a script so manual input is never interpolated into shell code.
          script: bash tool/e2e/run.sh

      - name: Remove generated credentials
        if: always()
        run: rm -f .env.json
