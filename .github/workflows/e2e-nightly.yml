name: Nightly E2E dispatch

on:
  schedule:
    - cron: '17 13 * * *' # 22:17 Asia/Seoul
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the maintained E2E branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # No target input: the branch workflow defaults to all nine suites.
        run: gh workflow run e2e.yml --ref feat/multi-language-learning
