name: Nightly E2E dispatch

on:
  schedule:
    - cron: '17 13 * * *' # 22:17 Asia/Seoul
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && vars.PATROL_E2E_ACTIVATION == 'challenge-boundaries-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the integrated E2E suite on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # No target input: the branch workflow defaults to all nine suites.
        run: gh workflow run e2e.yml --ref main
