name: vocab_kr
description: French ↔ Korean vocabulary learning app with spaced repetition, voice quiz, and social features.
publish_to: none
version: 1.0.0-beta.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Localisation
  easy_localization: ^3.0.7

  # Navigation
  go_router: ^14.6.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local database (type-safe SQLite ORM)
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.30
  path: ^1.9.0
  path_provider: ^2.1.5

  # Remote backend + auth
  supabase_flutter: ^2.8.4

  # Offline constrained recognition (vocab hands-free, ticket 2026-07-08).
  # The pub.dev release pins http ^0.13 (conflicts with supabase); the Vosk
  # team fixed it on master but never republished — pinned to that commit
  # (user-approved source, 2026-07-08).
  vosk_flutter:
    git:
      url: https://github.com/alphacep/vosk-flutter.git
      ref: e655a96f0ce0dadb5ea8900aa1ba23260c3ec904

  # Payments
  purchases_flutter: ^8.4.0

  # Audio
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  record: ^7.1.1

  # Speech
  speech_to_text: ^7.3.0

  # HTTP + crypto
  http: ^1.2.2
  crypto: ^3.0.6

  # String fuzzy matching
  string_similarity: ^2.0.0

  # Prefs + UUIDs
  shared_preferences: ^2.3.5
  uuid: ^4.5.1

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Sharing + file I/O
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Connectivity
  connectivity_plus: ^6.1.3

  # Deep links
  app_links: ^6.3.0

  # In-app review
  in_app_review: ^2.0.12

  # Shimmer skeleton loading
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.70.2

  # Animations
  # 3.3.0 (not 3.3.1): 3.3.1 requires archive ^4 while vosk_flutter needs ^3.
  lottie: 3.3.0

  # Fonts
  google_fonts: ^6.2.1
  # Vendored (packages/): patched native inference — audio_ctx scaled to
  # clip length; upstream always paid the full 30s encoder window (~6s per
  # answer on-device, field logs 2026-07-09/10).
  whisper_flutter_new:
    path: packages/whisper_flutter_new

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: '>=2.4.14 <3.0.0'
  freezed: ^2.5.7
  json_serializable: ^6.9.3
  riverpod_generator: ^2.6.1
  drift_dev: ^2.22.1
  analyzer_plugin: ^0.13.4
  patrol: ^4.6.1


flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/sounds/
    - assets/images/
    - assets/animations/
    - assets/translations/
